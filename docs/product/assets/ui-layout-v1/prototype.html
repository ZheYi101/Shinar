 if(id==='data')content=`<section class="settings-section">${settingRow('材料与对话','保存材料、确认发送的文字、完整成功的回复和复习项。','<span>本机数据库</span>')}${settingRow('未发送内容','草稿和未发送的原文指向留在当前界面内存中。','<span class="muted">不记入已确认历史</span>')}${settingRow('录音处理','录音用于识别与播放处理；不作为长期学习历史保存。','<span class="muted">临时处理</span>')}</section><section class="settings-section">${settingRow('云端服务','使用云端服务时，相关材料与对话会按当前配置发送。','<span class="muted">按服务配置发送相关内容</span>')}${settingRow('导出会话','在对应对话的复盘页导出该会话。',btn('去本次复盘','review','quiet'))}${settingRow('重置当前选择','清除当前界面选择；不表示删除材料与历史。',btn('重置当前选择','','danger'))}</section>`;
 return `<div class="settings-page">${content}</div>`;
}
function languageControl(){return `<select id="material-language" aria-label="材料语言">${['英语','日语','中文'].map(language=>`<option ${state.materialLanguage===language?'selected':''}>${language}</option>`).join('')}</select>`}
function importReady(){return state.modalTab==='file'?Boolean(state.fileName):Boolean(state.pasteText.trim())}
function importPage(){return `<section class="import-page" aria-label="导入材料"><div class="import-switch"><button class="reader-tool" data-view="library" aria-label="返回材料库" title="返回材料库">←</button><div class="tabs"><button class="${state.modalTab==='file'?'active':''}" data-action="import-file">本地文件</button><button class="${state.modalTab==='paste'?'active':''}" data-action="import-paste">粘贴内容</button></div></div><div class="import-body">${state.modalTab==='file'?`${state.fileName?`<div class="selected-file"><div class="file-monogram" aria-hidden="true">${esc(state.fileName.split('.').pop().toUpperCase().slice(0,4))}</div><div class="grow"><strong>${esc(state.fileName)}</strong>${state.fileSize?`<span class="small muted">${(state.fileSize/1024).toFixed(1)} KB</span>`:''}</div><button class="btn quiet" data-action="choose-file">更换文件</button><button class="reader-tool" data-action="remove-file" aria-label="移除文件">×</button></div><label class="field">材料名<input id="import-title" value="${esc(state.importTitle)}" autocomplete="off"></label>`:`<div class="file-drop" id="file-drop"><button class="btn" data-action="choose-file">选择文件</button><span class="small muted">或拖入文件</span></div>`}<input id="file-input" type="file" hidden accept=".txt,.md,.markdown,.docx,.srt,.vtt,.epub,.xlsx,.mp4,.mkv,.webm,.mov,.avi">`:`<label class="paste-heading"><span class="sr-only">材料名（可选）</span><input id="paste-title" aria-label="材料名（可选）" placeholder="材料名（可选）" value="${esc(state.pasteTitle)}"></label><label class="paste-content"><span class="sr-only">原文或字幕</span><textarea id="paste-text" aria-label="原文或字幕" placeholder="粘贴原文或字幕">${esc(state.pasteText)}</textarea></label>`}<div class="import-actions"><button class="btn primary" id="import-continue" data-action="continue-import" ${importReady()?'':'disabled'}>继续</button><label class="language-field">语言 ${languageControl()}</label></div></div></section>`}
function scopeEnd(){const text=paragraphs.join(' '),position=Math.floor(text.length*state.scopePercent/100),previous=text.lastIndexOf('. ',position),next=text.indexOf('. ',position);return text.slice(previous<0?0:previous+2,next<0?text.length:next+1);}
function scopeHit(index){if(!state.partial)return false;if(!state.scopePreview)return false;return state.scopeMethod==='point'?state.scopePoint===index+1:paragraphs[index].includes(state.scopeMethod==='sentence'?state.scopeSentence.trim():scopeEnd());}
function scopeParagraphMarkup(text,index){if(!scopeHit(index)||state.scopeMethod==='point')return esc(text);const phrase=state.scopeMethod==='sentence'?state.scopeSentence.trim():scopeEnd(),position=text.indexOf(phrase);return esc(text.slice(0,position))+`<mark class="scope-exact" title="已读至此">${esc(phrase)}</mark>`+esc(text.slice(position+phrase.length));}
function scopePage(){const ready=!state.partial||state.scopePreview;return `<section class="scope-page" aria-label="材料已读范围"><div class="scope-header"><div class="material-identity"><h2>Lolita</h2><span class="muted small">英语 · EPUB</span><div class="grow"></div><button class="btn quiet" data-action="cancel-scope">返回</button></div><div class="tabs"><button data-action="cancel-scope">对话 <span class="muted small">3</span></button><button class="active">已读范围</button><button data-action="references">参考</button></div></div><div class="scope-workspace"><div class="scope-reading" tabindex="0" aria-label="阅读范围原文">${paragraphs.map((text,i)=>`<div class="scope-passage ${scopeHit(i)?'is-boundary'+(state.scopeMethod!=='point'?' is-exact':''):''}"><button class="scope-paragraph" data-scope-paragraph="${i+1}" aria-label="已读至第 ${i+1} 段" aria-pressed="${scopeHit(i)}"><span class="paragraph-number" aria-hidden="true">${i+1}</span><span>${scopeParagraphMarkup(text,i)}</span></button>${scopeHit(i)&&state.scopeMethod==='point'?'<span class="boundary-marker">已读至此</span>':''}</div>`).join('')}</div><aside class="scope-controls"><div class="scope-kind" role="group" aria-label="已读范围"><button class="${!state.partial?'active':''}" data-action="scope-whole" aria-pressed="${!state.partial}">已读完</button><button class="${state.partial?'active':''}" data-action="scope-partial" aria-pressed="${state.partial}">部分已读</button></div>${state.partial?`<div class="scope-methods" role="group" aria-label="定位方式">${[['point','点选末段'],['sentence','末句定位'],['percent','大致进度']].map(([id,label])=>`<button class="${state.scopeMethod===id?'active':''}" data-action="scope-${id}" aria-pressed="${state.scopeMethod===id}">${label}</button>`).join('')}</div>${state.scopeMethod==='sentence'?`<label class="field">已读末句<textarea id="scope-sentence" rows="4" placeholder="粘贴已读到的最后一句">${esc(state.scopeSentence)}</textarea></label><button class="btn" data-action="locate-scope">定位</button>`:state.scopeMethod==='percent'?`<label class="field">进度<div class="percent-field"><input id="scope-percent" type="number" value="${state.scopePercent}" min="1" max="99" aria-label="已读百分比"><span>%</span></div></label><button class="btn" data-action="preview-scope">定位</button>`:''}${state.scopeError?`<p class="field-error" role="alert">${state.scopeError}</p>`:''}`:''}<div class="scope-actions"><button class="btn primary" id="scope-confirm" data-action="confirm-scope" ${ready?'':'disabled'}>${state.importFlow?'保存材料':'保存范围'}</button><button class="btn quiet" data-action="cancel-scope">取消</button></div></aside></div></section>`}
function extensionsPage(){return `<section class="extensions-page" aria-label="更多"><button class="reader-tool" data-view="library" aria-label="返回材料库" title="返回材料库">←</button><div class="extensions-list">${['练习','自制语音场景','声音工具'].map(label=>`<div class="planned-row"><span class="grow">${label}</span><span class="tag">规划</span></div>`).join('')}</div></section>`}
function acceptFile(file){if(!file)return;state.fileName=file.name;state.fileSize=file.size;state.importTitle=file.name.replace(/\.[^.]+$/,'');render();}
function invalidateScope(){state.scopePreview=false;state.scopeError='';document.getElementById('scope-confirm').disabled=true;document.querySelectorAll('.scope-passage').forEach(e=>e.classList.remove('is-boundary','is-exact'));document.querySelectorAll('.boundary-marker').forEach(e=>e.remove());document.querySelectorAll('.scope-exact').forEach(e=>e.replaceWith(document.createTextNode(e.textContent)));document.querySelectorAll('.scope-paragraph').forEach(e=>e.setAttribute('aria-pressed','false'));document.querySelector('.field-error')?.remove();}
function showBoundary(){render();document.querySelector('.scope-passage.is-boundary')?.scrollIntoView({block:'nearest'});}
function mobileBottom(){return `<div class="mobile-bottom">${nav('材料','library','book')}${nav('复习','queue','review')}${nav('设置','settings-appearance','settings')}</div>`}
function chrome(){const isChat=['chat','paragraph','selection','voice','completed','error'].includes(state.view),compare=['paragraph','selection'].includes(state.view);const context=state.view.startsWith('settings')?{appearance:'外观',learning:'学习偏好',services:'模型与服务',audio:'音频设备',local:'本地语音模型',data:'数据与隐私'}[state.view.replace('settings-','')]:isChat?'Lolita':'';return `<div class="window-chrome"><button class="reader-tool" data-action="nav" aria-label="展开或收起侧栏" title="展开或收起侧栏">${utility('panel')}</button>${context?`<span class="compact-context" title="${esc(context)}">${esc(context)}</span>`:''}<div class="grow"></div>${isChat?`${!compare?'<button class="chrome-action" data-view="paragraph" aria-label="看看原文" title="Lolita · 已读完">原文</button>':''}<button class="chrome-action" data-action="menu" aria-label="对话菜单">···</button>`:''}<span class="window-actions" aria-hidden="true">− □ ×</span></div>`}
function render(){const sourceScroll=document.querySelector('.source-text')?.scrollTop||0,scopeScroll=document.querySelector('.scope-reading')?.scrollTop||0;picker.value=state.view;document.getElementById('design-status').textContent=views.find(v=>v[0]===state.view)?.[2]||'';let body='';if(state.view.startsWith('settings'))body=settings();else if(state.view==='import')body=importPage();else if(state.view==='scope')body=scopePage();else if(state.view==='extensions')body=extensionsPage();else if(state.view==='library'||state.view==='empty')body=library(state.view==='empty');else if(state.view==='material')body=material();else if(state.view==='new')body=newChat();else if(state.view==='review')body=review();else if(state.view==='queue')body=queue();else body=chat();app.innerHTML=`<div class="shell ${state.collapsed?'sidebar-collapsed':''} ${state.navOpen?'nav-open':''}">${sidebar()}<section class="right">${chrome()}<main class="main">${body}${state.popover?'<div class="popover"><button data-action="finish-review">结束并复盘</button><button data-view="material">本材料全部对话</button><button data-action="details">本轮信息</button></div>':''}</main></section></div>`;document.title='Shinar · '+views.find(v=>v[0]===state.view)?.[1];const reader=document.querySelector('.source-text');if(reader)reader.scrollTop=sourceScroll;const scopeReader=document.querySelector('.scope-reading');if(scopeReader)scopeReader.scrollTop=scopeScroll;}
function go(view,fromHistory=false){if(!views.some(v=>v[0]===view))return;if(state.voiceActive&&['completed','material','library','new'].includes(view)){toast('请先结束语音，再切换材料或对话。');return;}rememberDraft();if(view==='scope'&&state.view!=='scope'&&!fromHistory){state.scopeReturn=state.view;state.importFlow=state.view==='import';}if(view==='voice')state.voiceActive=true;state.view=view;if(view==='completed')state.finished=true;else if(['chat','new','material','library'].includes(view))state.finished=false;state.navOpen=false;state.popover=false;state.sourceNavOpen=false;state.sourceSearchOpen=false;if(view==='paragraph'&&!state.range)state.range='paragraph';if(view==='selection'){state.range='text';state.selectedText='Some stories ask us to listen more carefully.'}const url=new URL(location.href);url.searchParams.set('view',view);if(!fromHistory&&new URL(location.href).searchParams.get('view')!==view)history.pushState(null,'',url);render();}
function rememberDraft(){const field=document.getElementById('draft')||document.getElementById('opening');if(field)state.draft=field.value;}
function toast(message){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),3200);}
function send(){rememberDraft();if(!state.draft.trim()){toast('先写下你想说的话');return;}state.extraMessages.push(state.draft.trim());state.draft='';render();toast('已演示本地发送；未调用模型或保存到学习数据库');}
app.addEventListener('input',e=>{if(['draft','opening'].includes(e.target.id))state.draft=e.target.value;if(e.target.id==='material-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('#material-rows tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q));}if(e.target.id==='source-find'){state.sourceQuery=e.target.value.trim();document.getElementById('find-result').textContent=state.sourceQuery?searchCount():'';}if(['paste-title','paste-text'].includes(e.target.id)){state[e.target.id==='paste-title'?'pasteTitle':'pasteText']=e.target.value;document.getElementById('import-continue').disabled=!importReady();}if(e.target.id==='import-title')state.importTitle=e.target.value;if(e.target.id==='scope-sentence'){state.scopeSentence=e.target.value;state.scopePreview=false;invalidateScope();}if(e.target.id==='scope-percent'){state.scopePercent=Number(e.target.value);state.scopePreview=false;invalidateScope();}});
app.addEventListener('change',e=>{if(e.target.id==='chapter'){rememberDraft();state.chapter=e.target.value==='all'?'4':e.target.value;state.range=e.target.value==='all'?null:'chapter';state.preview=false;state.sourceNavOpen=false;render();document.querySelector('.source-text').scrollTop=0;}if(e.target.id==='paragraph-jump'&&e.target.value&&!state.finished){rememberDraft();state.paragraph=Number(e.target.value);state.range='paragraph';state.sourceNavOpen=false;render();document.querySelector(`[data-paragraph="${state.paragraph}"]`).scrollIntoView({block:'center'});}if(e.target.id==='material-language')state.materialLanguage=e.target.value;if(e.target.id==='file-input')acceptFile(e.target.files[0]);});
app.addEventListener('keydown',e=>{if(e.target.id==='draft'&&e.ctrlKey&&e.key==='Enter'&&!e.isComposing){e.preventDefault();send();}});
app.addEventListener('mouseup',e=>{const paragraph=e.target.closest('.source-paragraph');if(!paragraph||state.finished)return;state.paragraph=Number(paragraph.dataset.paragraph);const selection=window.getSelection();const text=selection?.toString().trim();if(text){rememberDraft();state.selectedText=text;state.range='text';state.preview=false;render();}});
app.addEventListener('click',e=>{const endpoint=e.target.closest('[data-scope-paragraph]');if(endpoint){state.partial=true;state.scopeMethod='point';state.scopePoint=Number(endpoint.dataset.scopeParagraph);state.scopePreview=true;state.scopeError='';render();return;}const link=e.target.closest('[data-view]');if(link){go(link.dataset.view);return;}const para=e.target.closest('[data-paragraph]');if(para){if(state.finished)return;state.paragraph=Number(para.dataset.paragraph);if(window.getSelection()?.toString().trim())return;rememberDraft();state.range='paragraph';state.preview=false;render();return;}const a=e.target.closest('[data-action]');if(!a){if(e.target.closest('.review-question .btn')){state.reviewAnswer=true;render();}else if(e.target.closest('.btn'))toast('这是交互参考稿；此操作未连接实际服务。');return;}const action=a.dataset.action;
 if(action==='nav'){rememberDraft();if(innerWidth<=850)state.navOpen=!state.navOpen;else state.collapsed=!state.collapsed;render();}
 else if(action==='finish-review'){state.voiceActive=false;go('review');}
 else if(action==='source-nav'){state.sourceNavOpen=!state.sourceNavOpen;state.sourceSearchOpen=false;render();document.getElementById('chapter')?.focus();}
 else if(action==='source-search'){state.sourceSearchOpen=!state.sourceSearchOpen;state.sourceNavOpen=false;render();document.getElementById('source-find')?.focus();}
 else if(action==='close-source-controls'){state.sourceNavOpen=false;state.sourceSearchOpen=false;render();}
 else if(action==='menu'){state.popover=!state.popover;render();}
 else if(action==='clear-range'){rememberDraft();state.range=state.range==='chapter'?null:'chapter';render();}
 else if(action==='direction'){state.draft=a.textContent;render();document.getElementById('draft')?.focus();}
 else if(action==='send')send();
 else if(action==='role-mode'||action==='discussion-mode'){rememberDraft();state.roleplay=action==='role-mode';render();}
 else if(action==='toggle'){const on=a.getAttribute('aria-checked')==='true';a.setAttribute('aria-checked',String(!on));}
 else if(action==='theme'){toast('仅演示模式选择，深色视觉另行设计。');}
 else if(action==='open-paste'){state.modalTab='paste';go('import');}
 else if(action==='import-file'||action==='import-paste'){state.modalTab=action==='import-file'?'file':'paste';render();}
 else if(action==='choose-file')document.getElementById('file-input').click();
 else if(action==='scope-point'||action==='scope-sentence'||action==='scope-percent'){state.scopeMethod=action.replace('scope-','');state.scopePreview=state.scopeMethod==='point'&&state.scopePoint>0;state.scopeError='';render();}
 else if(action==='scope-whole'||action==='scope-partial'){state.partial=action==='scope-partial';render();}
 else if(action==='continue-import'){if(importReady())go('scope');}
 else if(action==='remove-file'){state.fileName='';state.fileSize=0;state.importTitle='';render();}
 else if(action==='cancel-scope')go(state.scopeReturn);
 else if(action==='confirm-scope'){if(!state.partial||state.scopePreview){state.scopeConfirmed=state.partial?'部分已读':'已读完';state.importFlow=false;go('material');}}
 else if(action==='locate-scope'){state.scopeError=state.scopeSentence.trim().length<8?'请输入至少 8 个字符。':paragraphs.join(' ').split(state.scopeSentence.trim()).length===1?'未找到末句。':paragraphs.join(' ').split(state.scopeSentence.trim()).length>2?'有多处匹配，请补充原文。':'';state.scopePreview=!state.scopeError;showBoundary();}
 else if(action==='preview-scope'){state.scopeError=!Number.isFinite(state.scopePercent)||state.scopePercent<1||state.scopePercent>99?'请输入 1–99。':'';state.scopePreview=!state.scopeError;showBoundary();}
 else if(action==='history-source'){state.preview=true;state.view='paragraph';render();}
 else if(action==='return-current'){state.preview=false;render();}
 else if(action==='end-voice'){state.voiceActive=false;render();}
 else if(action==='mute'){state.muted=!state.muted;render();}
 else if(action==='interrupt'){state.interrupted=true;render();}
 else if(action==='rate'){state.reviewAnswer=false;render();document.getElementById('queue-count').textContent='还有 2 项';toast('已演示评级记录');}
 else if(action==='references')toast('已有参考按需展开；不在材料页铺开题库或拟答。');
 else if(action==='extensions')toast('未来可扩展练习、自制语音等；本轮不新增可用功能。');
 else if(action==='cancel-download')toast('已演示取消状态；没有实际下载任务。');
 else if(action==='details')toast('实际应用按需显示首字、完整回复与后台状态；此稿没有模型调用。');
 else toast('此处只演示界面，不启用播放、麦克风或外部服务。');
});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='f'&&document.querySelector('.source-pane')){e.preventDefault();state.sourceSearchOpen=true;state.sourceNavOpen=false;render();document.getElementById('source-find')?.focus();}if(e.key==='Escape'){if(state.sourceNavOpen||state.sourceSearchOpen){state.sourceNavOpen=false;state.sourceSearchOpen=false;render();}else if(state.popover){state.popover=false;render();}else if(state.navOpen){state.navOpen=false;render();}else if(['paragraph','selection'].includes(state.view))go('chat');}});
window.addEventListener('popstate',()=>{const view=new URLSearchParams(location.search).get('view')||'library';go(view,true);});
app.addEventListener('dragover',e=>{if(e.target.closest('#file-drop')){e.preventDefault();e.target.closest('#file-drop').classList.add('drag-over');}});
app.addEventListener('dragleave',e=>e.target.closest('#file-drop')?.classList.remove('drag-over'));
app.addEventListener('drop',e=>{if(e.target.closest('#file-drop')){e.preventDefault();acceptFile(e.dataTransfer.files[0]);}});
picker.addEventListener('change',()=>go(picker.value));document.getElementById('previous').onclick=()=>go(views[(views.findIndex(v=>v[0]===state.view)+views.length-1)%views.length][0]);document.getElementById('next').onclick=()=>go(views[(views.findIndex(v=>v[0]===state.view)+1)%views.length][0]);
const example=params.get('example');
if(example==='paste'){state.modalTab='paste';state.pasteTitle='A familiar voice';state.pasteText=paragraphs.slice(0,3).join('\n\n');}
if(example==='file'){state.fileName='Lolita.epub';state.importTitle='Lolita';state.fileSize=496640;}
if(example==='sentence'){state.scopeMethod='sentence';state.scopeSentence='A voice can be familiar without being reliable.';state.scopePreview=true;}
if(example==='percent'){state.scopeMethod='percent';state.scopePercent=45;state.scopePreview=true;}
if(example==='point'){state.scopePoint=2;state.scopePreview=true;}
window.layoutPrototype={views:views.map(v=>({id:v[0],title:v[1],status:v[2]})),getState:()=>({...state}),go};render();
})();
</script>
</body>
</html>
