<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinguaLoop · 页面设计稿</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:25px 32px 48px;background:#f7f3e9;color:#3f382f;font:14px/1.6 "Microsoft YaHei UI",sans-serif}header{display:flex;align-items:center;gap:18px;margin-bottom:20px}h1{font:26px "Noto Serif","SimSun",serif;margin:0}header p{margin:3px 0 0;color:#6b6257;font-size:12px}a,button{color:inherit;font:inherit}a{text-decoration:none}button{cursor:pointer}header a,.filters button{padding:7px 12px;border:1px solid #d6cdbd;border-radius:5px;background:#fcf9f1;font-size:12px}header a:first-of-type{margin-left:auto;background:#56634f;color:#fffcf5;border-color:#56634f}.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.filters .active{background:#e2e4d7;border-color:#78816b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.tile{border:0;background:none;padding:0;text-align:left;min-width:0}.tile img{width:100%;display:block;border:1px solid #d6cdbd;border-radius:4px;background:#eee8dc;aspect-ratio:3/2;object-fit:contain}.tile.portrait img{object-fit:contain}.tile .caption{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:7px}.tile h2{font-size:13px;font-weight:500;margin:0}.tile span{font-size:10px;color:#6b6257}.tile:hover img{border-color:#56634f}.overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:16px;background:#eee8dc}.overview .tile .caption{margin:6px 0 1px}.overview .tile img{border-radius:2px}dialog{width:min(1500px,96vw);max-height:95vh;background:#f7f3e9;border:1px solid #887a67;border-radius:7px;padding:14px}dialog::backdrop{background:#302b25aa}.dialog-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}.dialog-top h2{font:19px "SimSun",serif;margin:0}.dialog-top button{margin-left:auto;background:none;border:0;font-size:24px}.dialog-top a{font-size:12px;text-decoration:underline}dialog img{width:100%;max-height:80vh;object-fit:contain;background:#eee8dc}#overview{display:none}.icon-proof{display:flex;align-items:center;gap:28px;padding:20px 0}.icon-proof div{display:flex;align-items:center;gap:8px;font-size:12px}.icon-proof img{width:48px;height:48px;object-fit:contain}h3{font-size:14px;margin-top:30px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:20px}.caption{flex-wrap:wrap;gap:1px!important}.icon-proof{flex-wrap:wrap}}@media(max-width:600px){.grid,.overview{grid-template-columns:1fr}header{flex-wrap:wrap}header a:first-of-type{margin-left:0}.filters{gap:5px}body{padding:15px}}
</style>
</head>
<body>
<header><div><h1>页面设计稿</h1><p>30 个视图 · 修订 3 · 2026-10-29 · 示例数据</p></div><a href="prototype.html">打开可点击稿</a></header>
<div class="filters"><button class="active" data-filter="all">全部</button><button data-filter="workspace">材料与对话</button><button data-filter="settings">设置</button><button data-filter="state">状态与扩展</button><button data-filter="responsive">窄窗口与专注模式</button></div>
<div id="overview" class="overview"></div><div id="gallery" class="grid"></div>
<section id="icon-section"><h3>原创图标母版</h3><div class="icon-proof"> <div><img src="icons/book.png" alt="书本图标">材料</div><div><img src="icons/chat.png" alt="对话图标">对话</div><div><img src="icons/mic.png" alt="麦克风图标">语音</div><div><img src="icons/settings.png" alt="设置图标">设置</div><div><img src="icons/review.png" alt="复盘图标">复盘</div><div><img src="icons/audio.png" alt="耳机图标">音频</div></div></section>
<dialog id="detail"><div class="dialog-top"><h2 id="detail-title"></h2><a id="detail-prototype" href="prototype.html">进入可点击稿</a><button aria-label="关闭预览">×</button></div><img id="detail-image" alt="页面设计稿"></dialog>
<script>
const screens=[
['01','library','材料库','现有能力 · 新布局','workspace'],['02','material','材料空间与对话','现有数据 · 新组织','workspace'],['03','import','导入材料','文件与粘贴入口','workspace'],['04','scope','已读范围','精确定位与进度核对','workspace'],['05','new','新对话','自由开场与可选 roleplay','workspace'],['06','chat','自由聊天','紧凑顶部栏','workspace'],['07','paragraph','原文对照 · 选段','已认可交互 · 待实现','workspace'],['08','selection','原文对照 · 选句','已认可交互 · 待实现','workspace'],['09','voice','连续语音','目标状态 · 待验收','state'],['10','completed','已结束对话','只读历史','workspace'],['11','review','本次复盘','现有能力 · 新布局','workspace'],['12','queue','表达复习','回想与评级','workspace'],['13','settings-appearance','设置 · 外观','设置分类','settings'],['14','settings-learning','设置 · 学习偏好','设置分类','settings'],['15','settings-services','设置 · 模型与服务','只读连接信息','settings'],['16','settings-audio','设置 · 音频设备','输入与播放设备','settings'],['17','settings-local','设置 · 本地语音模型','独立候选库','settings'],['18','settings-data','设置 · 数据与隐私','保存、导出与重置','settings'],['19','empty','空材料库','空状态','state'],['20','error','回复失败','恢复路径','state'],['21','extensions','后续功能扩展位置','规划预留 · 非功能交付','state'],['22','chat-narrow','窄窗口 · 聊天','390 × 844','responsive'],['23','source-narrow','窄窗口 · 原文','390 × 844','responsive'],['24','settings-narrow','窄窗口 · 设置','390 × 844','responsive'],['25','chat-focus','专注聊天','56px 收起侧栏','responsive'],['26','import-paste','粘贴导入','主区编辑 · 保留草稿','workspace'],['27','import-file','文件已选择','文件信息与名称','workspace'],['28','scope-sentence','末句定位','原文旁定位核对','workspace'],['29','scope-progress','进度定位','定位后核对真实末句','workspace'],['30','scope-narrow','窄窗口 · 已读范围','页内流动布局','responsive']
];
const route=id=>({'chat-narrow':'chat','source-narrow':'selection','settings-narrow':'settings-learning','chat-focus':'chat','import-paste':'import','import-file':'import','scope-sentence':'scope','scope-progress':'scope','scope-narrow':'scope'}[id]||id);
const example=id=>({'import-paste':'paste','import-file':'file','scope-sentence':'sentence','scope-progress':'percent','scope-narrow':'point'}[id]||'');
const gallery=document.getElementById('gallery');
function tile(s){return `<button class="tile ${s[4]==='responsive'&&s[1]!=='chat-focus'?'portrait':''}" data-id="${s[0]}"><img src="screens/${s[0]}-${s[1]}.png?rev=3" alt="${s[2]}"><div class="caption"><h2>${s[0]} · ${s[2]}</h2><span>${s[3]}</span></div></button>`}
function draw(filter='all'){gallery.innerHTML=screens.filter(s=>filter==='all'||s[4]===filter).map(tile).join('')}
draw();document.querySelector('.filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));draw(b.dataset.filter)};
const dialog=document.getElementById('detail');document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const s=screens.find(x=>x[0]===b.dataset.id);document.getElementById('detail-title').textContent=s[0]+' · '+s[2];document.getElementById('detail-image').src=`screens/${s[0]}-${s[1]}.png?rev=3`;document.getElementById('detail-prototype').href='prototype.html?view='+route(s[1])+(s[1]==='chat-focus'?'&nav=compact':'')+(example(s[1])?'&example='+example(s[1]):'');dialog.showModal()});dialog.querySelector('button').onclick=()=>dialog.close();
if(new URLSearchParams(location.search).get('overview')==='1'){document.querySelector('header').remove();document.querySelector('.filters').remove();document.getElementById('icon-section').remove();gallery.remove();const area=document.getElementById('overview');area.style.display='grid';area.innerHTML=screens.filter(s=>['01','03','04','08','14','17'].includes(s[0])).map(tile).join('');document.body.style.padding='0';}
</script>
</body>
</html>
