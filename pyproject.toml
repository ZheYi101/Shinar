[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lingualoop"
version = "0.1.0"
description = "A conversational language learning platform built around reviewable learning loops."
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "langchain-openai>=1.6.0",
    "langgraph>=0.2",
    "loguru>=0.7.3",
    "pydantic>=2",
    "python-docx>=1.1",
    "httpx>=0.28,<1",
    "pysubs2>=1.8,<1.9",
    "openpyxl>=3.1,<4",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
local-speech = [
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "numpy>=2,<3",
    "psutil>=7.2,<8",
]
desktop = [
    "PySide6==6.11.1",
]
realtime = [
    "livekit==1.1.21",
    "livekit-api==1.2.2",
]
dev = [
    "pytest>=8",
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "local_speech_integration: real offline models; requires --run-local-speech and prepared assets",
    "realtime_integration: real local RTC; requires --run-realtime",
    "real_ai: paid integration test; requires --run-real-ai and RUN_REAL_AI_TESTS=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Start with correctness checks; expand style checks per module without a bulk rewrite.
select = ["E4", "E9", "F63", "F7", "F82", "B006", "B008", "B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lingualoop.local_speech" = ["catalog.json"]
"lingualoop.desktop" = ["qml/*.qml", "qml/*/*.qml", "qml/*/qmldir", "qml/assets/*.svg", "qml/assets/LICENSE", "qml/assets/fonts/*", "qml/assets/illustrated/*", "translations/*.ts", "translations/*.qm"]

[project.scripts]
lingualoop = "lingualoop.cli:main"
lingualoop-desktop = "lingualoop.desktop.app:main"
